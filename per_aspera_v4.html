<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PER ASPERA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2a2a2a;--border2:#333;
  --text:#e8e8e8;--muted:#555;--muted2:#888;
  --bjj:#5fa8ff;--kick:#ff5f5f;--gym:#b06bff;--accent:#c8f564;--accent2:#a8d444;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
body.theme-steel{--bg:#141618;--surface:#1e2124;--surface2:#26292d;--border:#2e3236;--border2:#383d42;--text:#dce8f0;--muted:#445060;--muted2:#7a8fa0;--accent:#7ec8e3;--accent2:#5ab0cc;}
body.theme-ember{--bg:#0f0d0c;--surface:#1c1714;--surface2:#241f1a;--border:#2e2720;--border2:#3a3028;--text:#f0e6dc;--muted:#553322;--muted2:#997755;--accent:#ff7733;--accent2:#e05a1a;}
body.theme-ash{--bg:#f5f4f2;--surface:#fff;--surface2:#eeece8;--border:#dddbd6;--border2:#ccc9c2;--text:#1a1916;--muted:#aaa8a2;--muted2:#888580;--accent:#1a1916;--accent2:#333;}
body.theme-blood{--bg:#0d0c0c;--surface:#1a1515;--surface2:#201818;--border:#2e2020;--border2:#3a2828;--text:#f0e0e0;--muted:#551111;--muted2:#994444;--accent:#cc2233;--accent2:#aa1122;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;}

/* ── Layout ── */
.app{max-width:700px;margin:0 auto;padding:0 0 calc(64px + var(--safe-bottom));}

/* ── Header ── */
.header{display:flex;align-items:center;padding:20px 16px 0;gap:10px;position:relative;}
.header h1{font-family:'Cinzel',serif;font-size:22px;font-weight:700;letter-spacing:2px;color:var(--text);}
.header-sub{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.5px;}
.streak{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);}
.hamburger{background:none;border:none;color:var(--muted2);cursor:pointer;padding:4px;display:flex;flex-direction:column;gap:4px;margin-left:8px;}
.hamburger span{display:block;width:20px;height:2px;background:currentColor;border-radius:1px;transition:all .2s;}

/* ── Bottom nav tabs ── */
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);z-index:100;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;cursor:pointer;color:var(--muted2);transition:color .15s;border:none;background:none;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--accent);}
.nav-icon{font-size:18px;line-height:1;}
.nav-label{font-size:10px;font-weight:500;}
.nav-tab.active .nav-label{color:var(--accent);}

/* ── Sections ── */
.section{display:none;padding:16px 16px 0;}
.section.active{display:block;}

/* ── Settings drawer ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;}
.drawer-overlay.show{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,90vw);background:var(--surface);border-left:1px solid var(--border2);z-index:301;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:24px 20px;}
.drawer.show{transform:translateX(0);}
.drawer-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.drawer-title{font-size:14px;font-weight:600;}
.drawer-close{background:none;border:none;color:var(--muted2);font-size:22px;cursor:pointer;line-height:1;}
.settings-block{margin-bottom:24px;}
.settings-block-title{font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.theme-swatch{border:2px solid var(--border2);border-radius:8px;padding:8px 4px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .15s;}
.theme-swatch.active{border-color:var(--accent);}
.swatch-dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.1);}
.swatch-label{font-size:9px;color:var(--muted2);font-weight:500;}
.theme-swatch.active .swatch-label{color:var(--accent);}
.data-btn{width:100%;padding:10px 12px;background:none;border:1px solid var(--border2);border-radius:7px;color:var(--muted2);font-size:13px;cursor:pointer;text-align:left;margin-bottom:6px;transition:all .15s;}
.data-btn:hover{color:var(--text);}
.data-btn.danger{color:#ff5f5f;}
.data-btn.danger:hover{background:rgba(255,95,95,.07);}

/* ── Form ── */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;}
label{display:block;font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;transition:border-color .15s;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:80px;}
select option{background:var(--surface2);}

/* Type selector */
.type-selector{display:flex;gap:8px;margin-bottom:16px;}
.type-btn{flex:1;padding:12px 4px;border:1px solid var(--border2);border-radius:10px;background:var(--surface2);color:var(--muted2);cursor:pointer;font-size:11px;font-weight:600;text-align:center;transition:all .15s;}
.type-btn.active[data-type="bjj"]{border-color:var(--bjj);color:var(--bjj);background:rgba(95,168,255,.08);}
.type-btn.active[data-type="kick"]{border-color:var(--kick);color:var(--kick);background:rgba(255,95,95,.08);}
.type-btn.active[data-type="gym"]{border-color:var(--gym);color:var(--gym);background:rgba(176,107,255,.08);}
.type-icon{font-size:20px;display:block;margin-bottom:4px;}
.fields-bjj,.fields-kick,.fields-gym{display:none;}
.fields-bjj.show,.fields-kick.show,.fields-gym.show{display:block;}

/* Date */
.date-quick{display:flex;gap:6px;margin-bottom:8px;}
.date-quick-btn{flex:1;padding:10px 4px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--muted2);font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s;}
.date-quick-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(200,245,100,.06);}
.date-other-btn{width:100%;padding:9px 12px;background:none;border:1px dashed var(--border2);border-radius:8px;color:var(--muted2);font-size:12px;cursor:pointer;text-align:left;transition:all .15s;}
.date-other-btn.open{border-color:var(--accent);color:var(--accent);}
/* Mini cal — fixed modal, always centered */
.mini-cal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.mini-cal-overlay.show{display:flex;}
.mini-cal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:16px;width:min(320px,88vw);position:relative;z-index:501;}
.mini-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.mini-cal-nav button{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:20px;padding:4px 10px;}
.mini-cal-nav button:hover{color:var(--text);}
.mini-cal-title{font-size:14px;font-weight:600;}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.mini-cal-dow{text-align:center;font-size:10px;color:var(--muted);padding:4px 0;}
.mini-cal-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:background .1s;}
.mini-cal-day:hover{background:var(--border2);}
.mini-cal-day.empty{cursor:default;pointer-events:none;}
.mini-cal-day.today{color:var(--accent);font-weight:600;}
.mini-cal-day.selected{background:var(--accent);color:#0f0f0f;font-weight:700;}
.mini-cal-close{width:100%;margin-top:12px;padding:10px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--muted2);font-size:13px;cursor:pointer;}

/* Duration */
.duration-row{display:flex;align-items:center;gap:8px;}
.dur-select{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 8px;font-size:18px;font-family:'JetBrains Mono',monospace;font-weight:500;cursor:pointer;text-align:center;-webkit-appearance:none;appearance:none;}
.dur-select:focus{outline:none;border-color:var(--accent);}
.dur-sep{font-size:22px;color:var(--muted);flex-shrink:0;}
.dur-unit{font-size:11px;color:var(--muted2);flex-shrink:0;}

/* Gym exercise builder */
.body-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
.body-tab{padding:6px 12px;font-size:11px;font-weight:600;border:1px solid var(--border2);border-radius:20px;background:none;color:var(--muted2);cursor:pointer;transition:all .15s;}
.body-tab.active{background:var(--gym);color:#fff;border-color:var(--gym);}
.preset-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:32px;}
.preset-btn{padding:5px 12px;font-size:12px;border:1px solid var(--border2);border-radius:20px;background:var(--surface2);color:var(--muted2);cursor:pointer;transition:all .15s;}
.preset-btn:hover{border-color:var(--gym);color:var(--gym);}
.exercise-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.exercise-row{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.exercise-row-top{display:flex;align-items:center;gap:8px;}
.exercise-name{flex:1;font-size:13px;font-weight:500;}
.exercise-body-badge{font-size:10px;color:var(--muted2);background:var(--border);padding:2px 6px;border-radius:4px;}
.exercise-row-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.exercise-row-inputs input{font-size:13px;padding:7px 10px;}
.remove-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 4px;flex-shrink:0;}
.remove-btn:hover{color:#ff5f5f;}
.add-custom-row{display:flex;gap:8px;margin-top:4px;}
.add-custom-input{flex:1;font-size:13px;}
.add-custom-btn{padding:8px 14px;background:none;border:1px solid var(--gym);border-radius:8px;color:var(--gym);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}

/* Buttons */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.btn-save{padding:13px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-save:hover{border-color:var(--accent);color:var(--accent);}
.btn-save:disabled{opacity:.4;cursor:not-allowed;}
.btn-ai{padding:13px;background:var(--accent);color:#0f0f0f;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
.btn-ai:hover{background:var(--accent2);}
.btn-ai:disabled{opacity:.4;cursor:not-allowed;}
.ai-feedback{background:rgba(200,245,100,.04);border:1px solid rgba(200,245,100,.18);border-radius:12px;padding:16px;margin-top:12px;display:none;}
.ai-feedback.show{display:block;}
.ai-label{font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}
.ai-text{font-size:13px;line-height:1.75;color:var(--text);white-space:pre-wrap;}
.ai-loading{color:var(--muted2);font-size:13px;}
.save-toast{display:none;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:13px;color:var(--muted2);}
.save-toast.show{display:block;}

/* History */
.log-list{display:flex;flex-direction:column;gap:10px;}
.log-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s;}
.log-card:hover{border-color:var(--border2);}
.log-card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.log-type-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;}
.badge-bjj{background:rgba(95,168,255,.15);color:var(--bjj);}
.badge-kick{background:rgba(255,95,95,.15);color:var(--kick);}
.badge-gym{background:rgba(176,107,255,.15);color:var(--gym);}
.log-date{font-size:11px;color:var(--muted2);font-family:'JetBrains Mono',monospace;}
.log-title{font-size:14px;font-weight:500;margin-bottom:3px;}
.log-meta{font-size:12px;color:var(--muted2);}
.log-notes-preview{font-size:12px;color:var(--muted2);margin-top:6px;border-top:1px solid var(--border);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.log-feedback-indicator{font-size:11px;color:var(--accent);margin-top:4px;}
.empty{text-align:center;padding:48px 16px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:12px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:200;align-items:flex-end;justify-content:center;padding:0;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + var(--safe-bottom));}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal-close{background:none;border:none;color:var(--muted2);font-size:22px;cursor:pointer;}
.detail-row{margin-bottom:12px;}
.detail-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.detail-exercises{display:flex;flex-direction:column;gap:4px;}
.detail-exercise{display:flex;justify-content:space-between;font-size:13px;padding:6px 10px;background:var(--surface2);border-radius:6px;}
.detail-exercise-stats{color:var(--muted2);font-family:'JetBrains Mono',monospace;font-size:12px;}
.delete-btn{width:100%;padding:11px;background:none;border:1px solid var(--border2);border-radius:8px;color:#ff5f5f;font-size:13px;cursor:pointer;margin-top:16px;}
.delete-btn:hover{background:rgba(255,95,95,.08);}
.drill-item{padding:10px 0;border-bottom:1px solid var(--border);}
.drill-item:last-child{border-bottom:none;}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav-btn{background:none;border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:7px 14px;cursor:pointer;font-size:14px;}
.cal-nav-btn:hover{background:var(--surface2);}
.cal-title{font-size:15px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{text-align:center;font-size:10px;color:var(--muted);padding:4px 0;font-weight:500;}
.cal-day{border-radius:6px;display:flex;flex-direction:column;align-items:center;cursor:default;padding:3px 2px;min-height:48px;}
.cal-day.today{border:1px solid var(--accent);}
.cal-day.today .cal-day-num{color:var(--accent);}
.cal-day.has-log{cursor:pointer;}
.cal-day.has-log:hover{opacity:.8;}
.cal-day-num{font-size:11px;font-family:'JetBrains Mono',monospace;line-height:1;margin-bottom:2px;}
.cal-type-tags{display:flex;flex-direction:column;gap:1px;width:100%;}
.cal-type-tag{font-size:8px;font-weight:700;text-align:center;border-radius:2px;padding:1px 0;line-height:1.5;}
.cal-type-tag.bjj{background:rgba(95,168,255,.25);color:var(--bjj);}
.cal-type-tag.kick{background:rgba(255,95,95,.25);color:var(--kick);}
.cal-type-tag.gym{background:rgba(176,107,255,.25);color:var(--gym);}
.legend{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted2);}
.legend-dot{width:9px;height:9px;border-radius:2px;}

/* Stats */
.stats-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.stat-num{font-size:24px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--accent);}
.stat-label{font-size:10px;color:var(--muted2);margin-top:2px;}
.pie-row{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;}
.pie-svg-wrap{flex-shrink:0;}
.pie-items{display:flex;flex-direction:column;gap:7px;flex:1;}
.pie-item{display:flex;align-items:center;gap:8px;}
.pie-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.pie-lbl{font-size:12px;color:var(--muted2);flex:1;}
.pie-val{font-size:12px;font-family:'JetBrains Mono',monospace;}
.pie-pct{font-size:10px;color:var(--muted);margin-left:3px;}
.ctrl-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
.pill-group{display:flex;gap:4px;flex-wrap:wrap;}
.pill{padding:5px 12px;font-size:12px;font-weight:500;border:1px solid var(--border2);border-radius:20px;background:none;color:var(--muted2);cursor:pointer;transition:all .15s;}
.pill.active{background:var(--surface2);color:var(--text);border-color:var(--accent);}
.ctrl-sep{width:1px;height:18px;background:var(--border2);margin:0 2px;}
.chart-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.chart-section-title{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;}
.vchart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.vchart-bars{display:flex;align-items:flex-end;gap:5px;height:160px;}
.vchart-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:38px;gap:2px;}
.vchart-col.empty-bar{cursor:default;}
.vchart-bar-stack{display:flex;flex-direction:column;justify-content:flex-end;width:26px;border-radius:3px 3px 0 0;overflow:hidden;}
.vchart-seg{width:100%;}
.vchart-total{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-align:center;white-space:nowrap;min-height:11px;}
.vchart-x{font-size:9px;color:var(--muted2);text-align:center;margin-top:3px;white-space:nowrap;width:38px;}
.vchart-divider{height:1px;background:var(--border);margin:4px 0;}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div>
      <h1>PER ASPERA</h1>
      <div class="header-sub">per aspera ad astra</div>
    </div>
    <span class="streak" id="streakLabel"></span>
    <button class="hamburger" onclick="openDrawer()" aria-label="設定">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- LOG -->
  <div class="section" id="tab-log">
    <div style="padding-top:16px">
    <div class="form-card">
      <div style="margin-bottom:16px">
        <label>種別</label>
        <div class="type-selector">
          <div class="type-btn active" data-type="bjj" onclick="selectType('bjj')"><span class="type-icon">🥋</span>柔術</div>
          <div class="type-btn" data-type="kick" onclick="selectType('kick')"><span class="type-icon">🥊</span>キック</div>
          <div class="type-btn" data-type="gym" onclick="selectType('gym')"><span class="type-icon">🏋️</span>筋トレ</div>
        </div>
      </div>
      <div style="margin-bottom:16px">
        <label>日付</label>
        <div class="date-quick" id="dateQuick">
          <button class="date-quick-btn active" id="dqToday" onclick="pickQuick(0)">今日</button>
          <button class="date-quick-btn" id="dqYest"  onclick="pickQuick(1)">昨日</button>
          <button class="date-quick-btn" id="dq2"     onclick="pickQuick(2)">2日前</button>
        </div>
        <button class="date-other-btn" id="dateOtherBtn" onclick="toggleMiniCal()">▾ それ以前の日付を選ぶ</button>
      </div>
      <div style="margin-bottom:16px">
        <label>時間</label>
        <div class="duration-row">
          <select class="dur-select" id="selHour"></select>
          <span class="dur-unit">時間</span>

<script>
/* ══ PRESETS ══ */
const PRESETS={
  '胸':['ベンチプレス','インクラインDB','ダンベルフライ','ケーブルフライ','ディップス'],
  '背中':['デッドリフト','ベントロー','ラットプルダウン','ケーブルロウ','チンニング'],
  '肩':['ショルダープレス','サイドレイズ','フロントレイズ','フェイスプル','リアレイズ'],
  '腕':['バーベルカール','ハンマーカール','トライセプスPD','スカルクラッシャー','ディップス'],
  '脚':['スクワット','レッグプレス','レッグカール','レッグエクステンション','カーフレイズ'],
  '体幹':['プランク','クランチ','ロシアンツイスト','レッグレイズ','ドラゴンフラッグ'],
};
let currentPart='胸';
let gymExercises=[]; // [{name,part,weight,reps}]

/* ══ STATE ══ */
const STORAGE_KEY='training_logs_v1';
let logs=[];
let currentType='bjj';
let currentPeriod='week';
let currentGran='';
const today=new Date();
let selOffset=0;
let selYear=today.getFullYear(),selMonth=today.getMonth(),selDay=today.getDate();
let mcYear=selYear,mcMonth=selMonth;
let calYear=today.getFullYear(),calMonth=today.getMonth();

/* ══ STORAGE ══ */
async function saveLogs(){try{await window.storage.set(STORAGE_KEY,JSON.stringify(logs));}catch(e){}}
async function loadLogs(){
  try{const r=await window.storage.get(STORAGE_KEY);if(r)logs=JSON.parse(r.value);}catch(e){logs=[];}
  logs=logs.map(l=>{
    if(typeof l.duration==='number'||typeof l.duration==='string'){const m=parseInt(l.duration)||0;return{...l,duration:{h:Math.floor(m/60),m:m%60}};}
    return l;
  });
  if(!logs.length)injectDummyData();
  await loadTheme();
  initUI();
}

/* ══ INIT ══ */
function initUI(){
  initDurationSelects();
  updateDateLabel();
  renderMiniCal();
  renderPresets();
  renderStreak();
  renderStats();
}

/* ══ TABS ══ */
function switchTab(t,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(t==='history')renderHistory();
  if(t==='calendar')renderCalendar();
  if(t==='stats')renderStats();
}
function selectType(t){
  currentType=t;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===t));
  document.querySelectorAll('[class^="fields-"]').forEach(el=>el.classList.remove('show'));
  document.getElementById('fields-'+t).classList.add('show');
}

/* ══ DATE ══ */
function isoFromDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateFromOffset(n){const d=new Date(today);d.setDate(d.getDate()-n);return d;}
function selDateStr(){
  if(selOffset>=0)return isoFromDate(dateFromOffset(selOffset));
  return`${selYear}-${String(selMonth+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
}
function pickQuick(offset){
  selOffset=offset;
  document.getElementById('miniCal').classList.remove('show');
  document.getElementById('dateOtherBtn').classList.remove('open');
  [0,1,2].forEach(i=>document.getElementById(['dqToday','dqYest','dq2'][i]).classList.toggle('active',i===offset));
  updateDateLabel();
}
function updateDateLabel(){
  const d=selOffset>=0?dateFromOffset(selOffset):new Date(selYear,selMonth,selDay);
  const wd=['日','月','火','水','木','金','土'][d.getDay()];
  const label=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${wd}）`;
  const btn=document.getElementById('dateOtherBtn');
  if(selOffset<0){btn.textContent=`▾ ${label}`;btn.classList.add('open');}
  else{btn.textContent='▾ それ以前の日付を選ぶ';btn.classList.remove('open');}
}
function toggleMiniCal(){
  const ov=document.getElementById('miniCalOverlay');
  const show=!ov.classList.contains('show');
  ov.classList.toggle('show',show);
  if(show){
    if(selOffset<0){mcYear=selYear;mcMonth=selMonth;}
    else{mcYear=today.getFullYear();mcMonth=today.getMonth();}
    renderMiniCal();
  }
}
function closeMiniCalOnBg(e){if(e.target===document.getElementById('miniCalOverlay'))toggleMiniCal();}
function miniCalPrev(){mcMonth--;if(mcMonth<0){mcMonth=11;mcYear--;}renderMiniCal();}
function miniCalNext(){mcMonth++;if(mcMonth>11){mcMonth=0;mcYear++;}renderMiniCal();}
function renderMiniCal(){
  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('miniCalTitle').textContent=`${mcYear}年 ${mn[mcMonth]}`;
  const first=new Date(mcYear,mcMonth,1).getDay();
  const days=new Date(mcYear,mcMonth+1,0).getDate();
  const todayStr=isoFromDate(today);
  const curSelStr=selDateStr();
  const dows=['日','月','火','水','木','金','土'];
  let html=dows.map(d=>`<div class="mini-cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)html+=`<div class="mini-cal-day empty"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${mcYear}-${String(mcMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html+=`<div class="mini-cal-day${ds===curSelStr?' selected':''}${ds===todayStr&&ds!==curSelStr?' today':''}" onclick="pickCalDate(${mcYear},${mcMonth},${d})">${d}</div>`;
  }
  document.getElementById('miniCalGrid').innerHTML=html;
}
function pickCalDate(y,m,d){
  selYear=y;selMonth=m;selDay=d;selOffset=-1;
  [0,1,2].forEach(i=>document.getElementById(['dqToday','dqYest','dq2'][i]).classList.remove('active'));
  updateDateLabel();renderMiniCal();
  document.getElementById('miniCalOverlay').classList.remove('show');
}

/* ══ DURATION ══ */
function initDurationSelects(){
  const h=document.getElementById('selHour');
  const m=document.getElementById('selMin');
  h.innerHTML='';m.innerHTML='';
  for(let i=0;i<=5;i++)h.innerHTML+=`<option value="${i}">${i}</option>`;
  [0,5,10,15,20,25,30,35,40,45,50,55].forEach(v=>m.innerHTML+=`<option value="${v}">${String(v).padStart(2,'0')}</option>`);
  h.value='1';m.value='0';
}
function getDurationObj(){return{h:parseInt(document.getElementById('selHour').value),m:parseInt(document.getElementById('selMin').value)};}
function resetDuration(){document.getElementById('selHour').value='1';document.getElementById('selMin').value='0';}

/* ══ GYM PRESETS ══ */
function selectPart(part,btn){
  currentPart=part;
  document.querySelectorAll('.body-tab').forEach(b=>b.classList.toggle('active',b.dataset.part===part));
  renderPresets();
}
function renderPresets(){
  const list=document.getElementById('presetList');
  list.innerHTML=PRESETS[currentPart].map(name=>
    `<button class="preset-btn" onclick="addPresetEx('${name}','${currentPart}')">${name}</button>`
  ).join('');
}
function addPresetEx(name,part){
  gymExercises.push({name,part,weight:'',reps:''});
  renderExerciseList();
}
function addCustomEx(){
  const inp=document.getElementById('customExInput');
  const name=inp.value.trim();
  if(!name)return;
  gymExercises.push({name,part:currentPart,weight:'',reps:''});
  inp.value='';
  renderExerciseList();
}
function removeEx(idx){
  gymExercises.splice(idx,1);
  renderExerciseList();
}
function renderExerciseList(){
  document.getElementById('exercise-list').innerHTML=gymExercises.map((e,i)=>`
    <div class="exercise-row">
      <div class="exercise-row-top">
        <span class="exercise-name">${e.name}</span>
        <span class="exercise-body-badge">${e.part}</span>
        <button class="remove-btn" onclick="removeEx(${i})">×</button>
      </div>
      <div class="exercise-row-inputs">
        <input type="text" placeholder="重量 kg" value="${e.weight}" oninput="gymExercises[${i}].weight=this.value">
        <input type="text" placeholder="回数×セット" value="${e.reps}" oninput="gymExercises[${i}].reps=this.value">
      </div>
    </div>`).join('');
}

/* ══ FORM ══ */
function getFormData(){
  const dur=getDurationObj();
  let specific={};
  if(currentType==='bjj'){specific={notes:document.getElementById('bjj-notes').value,rounds:document.getElementById('bjj-rounds').value};}
  else if(currentType==='kick'){specific={notes:document.getElementById('kick-notes').value,rounds:document.getElementById('kick-rounds').value};}
  else{specific={exercises:gymExercises.map(e=>({...e})),notes:document.getElementById('gym-notes').value};}
  return{id:Date.now(),type:currentType,date:selDateStr(),duration:dur,...specific};
}
function resetForm(){
  ['bjj-notes','kick-notes','gym-notes'].forEach(id=>document.getElementById(id).value='');
  ['bjj-rounds','kick-rounds'].forEach(id=>document.getElementById(id).value='');
  gymExercises=[];renderExerciseList();
  resetDuration();
  selOffset=0;
  [0,1,2].forEach(i=>document.getElementById(['dqToday','dqYest','dq2'][i]).classList.toggle('active',i===0));
  updateDateLabel();
}

/* ══ SAVE ══ */
async function doSave(withAI){
  const btnS=document.getElementById('btnSave');
  const btnA=document.getElementById('btnAI');
  const fb=document.getElementById('aiFeedback');
  const fbText=document.getElementById('aiFeedbackText');
  const toast=document.getElementById('saveToast');
  const data=getFormData();
  logs.unshift(data);
  await saveLogs();
  renderStreak();
  resetForm();
  if(!withAI){fb.classList.remove('show');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500);return;}
  toast.classList.remove('show');
  fb.classList.add('show');
  fbText.innerHTML='<span class="ai-loading">分析中...</span>';
  btnS.disabled=true;btnA.disabled=true;
  const durLabel=data.duration.h>0?`${data.duration.h}時間${data.duration.m}分`:`${data.duration.m}分`;
  const recent=logs.slice(1,5);
  let prompt=`あなたは格闘技・筋トレのコーチです。以下の練習記録に対して、簡潔で実践的なフィードバックを日本語でください。\n\n【今日の記録】\n種別:${data.type==='bjj'?'柔術':data.type==='kick'?'キックボクシング':'筋トレ'}\n日時:${data.date} / ${durLabel}\n`;
  if(data.type!=='gym'&&data.rounds)prompt+=`スパー:${data.rounds}本\n`;
  if(data.type==='gym'&&data.exercises)data.exercises.forEach(e=>{prompt+=`  - ${e.name}(${e.part})${e.weight?' '+e.weight+'kg':''}${e.reps?' '+e.reps:''}\n`;});
  if(data.notes)prompt+=`メモ:${data.notes}\n`;
  if(recent.length){prompt+=`\n【直近】\n`;recent.forEach(l=>{const d=l.duration;prompt+=`- ${l.date} ${l.type==='bjj'?'柔術':l.type==='kick'?'キック':'筋トレ'} ${d?`${d.h}h${d.m}m`:''}${l.notes?' / '+l.notes.substring(0,30):''}\n`;});}
  prompt+=`\n構成（400文字以内）：\n1. 良かった点\n2. 改善・次に意識すること\n3. 次回試すこと（1点）`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const json=await res.json();
    const text=json.content.map(c=>c.text||'').join('');
    fbText.textContent=text;
    logs[0].aiFeedback=text;
    await saveLogs();
  }catch(e){fbText.textContent='⚠️ フィードバック取得に失敗しました。記録は保存されています。';}
  btnS.disabled=false;btnA.disabled=false;
}

/* ══ HELPERS ══ */
function durStr(d){if(!d)return'';if(typeof d==='object')return d.h>0?`${d.h}時間${d.m}分`:`${d.m}分`;return d+'分';}
function durMins(d){if(!d)return 0;if(typeof d==='object')return d.h*60+d.m;return parseInt(d)||0;}
function fmtH(v){return`${Math.floor(v/60)}h${v%60}m`;}
function renderStreak(){
  const label=document.getElementById('streakLabel');
  if(!logs.length){label.textContent='';return;}
  const dates=[...new Set(logs.map(l=>l.date))].sort((a,b)=>b.localeCompare(a));
  let streak=0,cur=new Date();cur.setHours(0,0,0,0);
  for(let d of dates){const dd=new Date(d);const diff=Math.round((cur-dd)/86400000);if(diff<=1){streak++;cur=dd;}else break;}
  label.textContent=streak>1?`🔥 ${streak}日連続`:'';
}

/* ══ HISTORY ══ */
function renderHistory(){
  const list=document.getElementById('logList');
  if(!logs.length){list.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><p>まだ記録がありません</p></div>`;return;}
  const sorted=[...logs].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  list.innerHTML=sorted.map(l=>{
    const origIdx=logs.indexOf(l);

function renderCalendar(){

const GRAN_OPTIONS={
  week:[{k:'day',l:'日別'},{k:'total',l:'合計'}],
  month:[{k:'day',l:'日別'},{k:'week',l:'週別'},{k:'total',l:'合計'}],
  year:[{k:'day',l:'日別'},{k:'week',l:'週別'},{k:'month',l:'月別'},{k:'total',l:'合計'}],
  all:[{k:'month',l:'月別'},{k:'year',l:'年別'},{k:'total',l:'合計'}]
};
function setPeriod(p,btn){
  currentPeriod=p;
  document.querySelectorAll('#periodPills .pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

function renderGranPills(){

    `<button class="pill${o.k===currentGran?' active':''}" onclick="setGran('${o.k}',this)">${o.l}</button>`

function setGran(g,btn){
  currentGran=g;
  document.querySelectorAll('#granPills .pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderStats();
}
function getDateRange(p){
  const now=new Date();now.setHours(0,0,0,0);
  if(p==='week'){
    const d=new Date(now);d.setDate(d.getDate()-d.getDay());
    const end=new Date(d);end.setDate(d.getDate()+6); // Sun to Sat (full week incl future)
    return{start:d,end};
  }
  if(p==='month'){return{start:new Date(now.getFullYear(),now.getMonth(),1),end:new Date(now.getFullYear(),now.getMonth()+1,0)};}
  if(p==='year'){return{start:new Date(now.getFullYear(),0,1),end:new Date(now.getFullYear(),11,31)};}
  return{start:new Date('2000-01-01'),end:now};
}
function sumType(arr,t){return arr.filter(l=>l.type===t).reduce((s,l)=>s+durMins(l.duration),0);}
function buildGroups(period,gran,filtered){
  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  if(gran==='total')return[{label:'合計',bjj:sumType(filtered,'bjj'),kick:sumType(filtered,'kick'),gym:sumType(filtered,'gym'),logs:filtered}];
  if(gran==='day'){
    const{start,end}=getDateRange(period);const groups=[];const cur=new Date(start);
    while(cur<=end){const ds=cur.toISOString().split('T')[0];const dl=filtered.filter(l=>l.date===ds);const wd=['日','月','火','水','木','金','土'][cur.getDay()];groups.push({label:`${cur.getMonth()+1}/${cur.getDate()}(${wd})`,bjj:sumType(dl,'bjj'),kick:sumType(dl,'kick'),gym:sumType(dl,'gym'),logs:dl,key:ds});cur.setDate(cur.getDate()+1);}
    return groups;
  }
  if(gran==='week'){
    const{start,end}=getDateRange(period);const weekMap={};
    const cur=new Date(start);cur.setDate(cur.getDate()-cur.getDay());
    while(cur<=end){const wk=cur.toISOString().split('T')[0];if(!weekMap[wk])weekMap[wk]={bjj:0,kick:0,gym:0,logs:[]};cur.setDate(cur.getDate()+7);}
    filtered.forEach(l=>{const d=new Date(l.date);const sun=new Date(d);sun.setDate(d.getDate()-d.getDay());const wk=sun.toISOString().split('T')[0];if(!weekMap[wk])weekMap[wk]={bjj:0,kick:0,gym:0,logs:[]};weekMap[wk][l.type]+=durMins(l.duration);weekMap[wk].logs.push(l);});
    return Object.entries(weekMap).sort(([a],[b])=>a.localeCompare(b)).map(([wk,v])=>{const d=new Date(wk);return{label:`${d.getMonth()+1}/${d.getDate()}週`,bjj:v.bjj,kick:v.kick,gym:v.gym,logs:v.logs,key:wk};});
  }
  if(gran==='month'){
    if(period==='year'){const yr=new Date().getFullYear();return Array.from({length:12},(_,m)=>{const ml=filtered.filter(l=>{const d=new Date(l.date);return d.getFullYear()===yr&&d.getMonth()===m;});const key=`${yr}-${String(m+1).padStart(2,'0')}`;return{label:mn[m],bjj:sumType(ml,'bjj'),kick:sumType(ml,'kick'),gym:sumType(ml,'gym'),logs:ml,key};});}
    if(!filtered.length)return[];
    const dates=filtered.map(l=>l.date).sort();const[sy,sm]=dates[0].split('-').map(Number);const[ey,em]=dates[dates.length-1].split('-').map(Number);const groups=[];let cy=sy,cm=sm-1;
    while(cy<ey||(cy===ey&&cm<=em-1)){const key=`${cy}-${String(cm+1).padStart(2,'0')}`;const ml=filtered.filter(l=>{const d=new Date(l.date);return d.getFullYear()===cy&&d.getMonth()===cm;});groups.push({label:`${cy}/${cm+1}`,bjj:sumType(ml,'bjj'),kick:sumType(ml,'kick'),gym:sumType(ml,'gym'),logs:ml,key});cm++;if(cm>11){cm=0;cy++;}}
    return groups;
  }
  if(gran==='year'){
    if(!filtered.length)return[];
    const dates=filtered.map(l=>l.date.split('-')[0]).sort();const sy=parseInt(dates[0]),ey=parseInt(dates[dates.length-1]);
    return Array.from({length:ey-sy+1},(_,i)=>{const yr=String(sy+i);const yl=filtered.filter(l=>l.date.startsWith(yr));return{label:yr+'年',bjj:sumType(yl,'bjj'),kick:sumType(yl,'kick'),gym:sumType(yl,'gym'),logs:yl,key:yr};});
  }
  return[];
}
function renderDonut(filtered){
  const totalBjj=sumType(filtered,'bjj'),totalKick=sumType(filtered,'kick'),totalGym=sumType(filtered,'gym');
  const tot=totalBjj+totalKick+totalGym;
  const R=44,cx=52,cy=52,stroke=14,circ=2*Math.PI*R;
  function arc(v,off,color){if(!tot||!v)return'';const dash=v/tot*circ;return`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;}
  const svg=`<svg width="104" height="104" viewBox="0 0 104 104"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="${stroke}"/>${arc(totalBjj,0,'var(--bjj)')}${arc(totalKick,totalBjj/tot*circ,'var(--kick)')}${arc(totalGym,(totalBjj+totalKick)/tot*circ,'var(--gym)')}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="var(--muted2)" font-family="JetBrains Mono,monospace">${tot?fmtH(tot):'0h'}</text><text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Inter,sans-serif">合計</text></svg>`;
  const pct=v=>tot?Math.round(v/tot*100):0;
  document.getElementById('pieRow').innerHTML=`<div class="pie-svg-wrap">${svg}</div><div class="pie-items">${[{c:'var(--bjj)',l:'柔術',v:totalBjj},{c:'var(--kick)',l:'キック',v:totalKick},{c:'var(--gym)',l:'筋トレ',v:totalGym}].map(i=>`<div class="pie-item"><div class="pie-dot" style="background:${i.c}"></div><div class="pie-lbl">${i.l}</div><div class="pie-val">${fmtH(i.v)}<span class="pie-pct">${pct(i.v)}%</span></div></div>`).join('')}</div>`;
}
function renderStats(){
  if(!currentGran){currentGran=GRAN_OPTIONS[currentPeriod][0].k;renderGranPills();}
  const{start,end}=getDateRange(currentPeriod);
  const now=new Date();now.setHours(0,0,0,0);
  // filter logs within range (use actual logged dates, not future)
  const filtered=logs.filter(l=>{const d=new Date(l.date);return d>=start&&d<=end;});
  const totalMin=filtered.reduce((s,l)=>s+durMins(l.duration),0);
  // count days with records
  const recordDays=new Set(filtered.map(l=>l.date)).size;
  // total days in the period (fixed, not capped at today)
  const periodDays=Math.round((end-start)/86400000)+1;
  const totalH=Math.floor(totalMin/60);
  const totalM=totalMin%60;
  const freqStr=`${recordDays}/${periodDays}日`;
  document.getElementById('statsTop').innerHTML=`
    <div class="stat-card"><div class="stat-num">${totalH}<span style="font-size:14px">h</span>${totalM}<span style="font-size:14px">m</span></div><div class="stat-label">合計時間</div></div>
    <div class="stat-card"><div class="stat-num" style="font-size:18px">${freqStr}</div><div class="stat-label">頻度</div></div>
    <div class="stat-card"><div class="stat-num">${filtered.length}</div><div class="stat-label">記録数</div></div>
  `;
  renderDonut(filtered);renderGranPills();
  const groups=buildGroups(currentPeriod,currentGran,filtered);
  const maxVal=Math.max(...groups.map(g=>g.bjj+g.kick+g.gym),1);
  const chartH=160;
  const titleMap={week:'今週',month:'今月',year:'今年',all:'全期間'};
  const granMap={day:'日別',week:'週別',month:'月別',year:'年別',total:'合計'};
  document.getElementById('chartTitle').textContent=`${titleMap[currentPeriod]} / ${granMap[currentGran]}`;
  document.getElementById('vchartBars').innerHTML=groups.map((g,gi)=>{
    const t=g.bjj+g.kick+g.gym;const hTotal=t/maxVal*chartH;
    const hBjj=t?g.bjj/t*hTotal:0,hKick=t?g.kick/t*hTotal:0,hGym=t?g.gym/t*hTotal:0;
    return`<div class="vchart-col${!t?' empty-bar':''}">
      <div class="vchart-total">${t?Math.round(t)+'m':''}</div>
      <div class="vchart-bar-stack" style="height:${chartH}px">
        ${hGym>0?`<div class="vchart-seg" style="height:${hGym}px;background:var(--gym);cursor:pointer" onclick="openDrill(${gi},'gym')"></div>`:''}
        ${hKick>0?`<div class="vchart-seg" style="height:${hKick}px;background:var(--kick);cursor:pointer" onclick="openDrill(${gi},'kick')"></div>`:''}
        ${hBjj>0?`<div class="vchart-seg" style="height:${hBjj}px;background:var(--bjj);cursor:pointer" onclick="openDrill(${gi},'bjj')"></div>`:''}
        ${!t?`<div style="height:3px;width:100%;background:var(--border2);border-radius:2px;margin-top:auto"></div>`:''}
      </div>
      <div class="vchart-x">${g.label}</div>
    </div>`;
  }).join('');
  window._chartGroups=groups;
}
function openDrill(gi,typeFilter){
  const g=window._chartGroups[gi];if(!g||!g.logs)return;
  const typeLabelMap={bjj:'柔術',kick:'キック',gym:'筋トレ'};
  const filtered=typeFilter?g.logs.filter(l=>l.type===typeFilter):g.logs;
  if(!filtered.length)return;
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const totalMins=sorted.reduce((s,l)=>s+durMins(l.duration),0);
  const periodLabel=['今週','今月','今年','全期間'][['week','month','year','all'].indexOf(currentPeriod)];
  let html=`<div class="modal-handle"></div><div class="modal-header"><div><div style="font-size:11px;color:var(--muted2);margin-bottom:4px">${periodLabel} / ${g.label}</div><div style="display:flex;align-items:center;gap:8px">${typeFilter?`<span class="log-type-badge badge-${typeFilter}">${typeLabelMap[typeFilter]}</span>`:''}<span style="font-size:15px;font-weight:600">${sorted.length}回・${fmtH(totalMins)}</span></div></div><button class="modal-close" onclick="closeModal()">×</button></div>`;
  sorted.forEach(l=>{
    const tl=typeLabelMap[l.type];
    const title=(l.notes||(l.exercises&&l.exercises.map(e=>e.name).join('・'))||'記録').substring(0,40);
    html+=`<div class="drill-item"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="log-type-badge badge-${l.type}">${tl}</span><span class="log-date">${l.date}</span>${l.duration?`<span style="font-size:11px;color:var(--muted2)">${durStr(l.duration)}</span>`:''}</div>${title?`<div style="font-size:13px;color:var(--muted2)">${title}</div>`:''}${l.rounds?`<div style="font-size:12px;color:var(--muted)">スパー ${l.rounds}本</div>`:''}${l.aiFeedback?`<div style="font-size:11px;color:var(--accent);margin-top:2px">✦ AIフィードバックあり</div>`:''}</div>`;
  });
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('show');
}
