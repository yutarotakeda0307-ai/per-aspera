<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PER ASPERA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2a2a2a;--border2:#333;
  --text:#e8e8e8;--muted:#666;--muted2:#888;
  --bjj:#5fa8ff;--kick:#ff5f5f;--gym:#b06bff;--accent:#c8f564;--accent2:#a8d444;
}
/* ── Themes ── */
body.theme-steel{
  --bg:#141618;--surface:#1e2124;--surface2:#26292d;--border:#2e3236;--border2:#383d42;
  --text:#dce8f0;--muted:#556070;--muted2:#7a8fa0;--accent:#7ec8e3;--accent2:#5ab0cc;
}
body.theme-ember{
  --bg:#0f0d0c;--surface:#1c1714;--surface2:#241f1a;--border:#2e2720;--border2:#3a3028;
  --text:#f0e6dc;--muted:#664433;--muted2:#997755;--accent:#ff7733;--accent2:#e05a1a;
}
body.theme-ash{
  --bg:#f5f4f2;--surface:#ffffff;--surface2:#eeece8;--border:#dddbd6;--border2:#ccc9c2;
  --text:#1a1916;--muted:#aaa8a2;--muted2:#888580;--accent:#1a1916;--accent2:#333;
}
body.theme-blood{
  --bg:#0d0c0c;--surface:#1a1515;--surface2:#201818;--border:#2e2020;--border2:#3a2828;
  --text:#f0e0e0;--muted:#662222;--muted2:#994444;--accent:#cc2233;--accent2:#aa1122;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;}
.app{max-width:860px;margin:0 auto;padding:24px 16px 80px;}
.header{display:flex;align-items:baseline;gap:12px;margin-bottom:28px;}
.header h1{font-size:20px;font-weight:600;letter-spacing:-.3px;}
.header-sub{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.streak{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);}
.tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);}
.tab{padding:8px 14px;font-size:13px;font-weight:500;color:var(--muted2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.section{display:none;}.section.active{display:block;}

/* ── Form ── */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.form-row.full{grid-template-columns:1fr;}
label{display:block;font-size:11px;font-weight:500;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:88px;}
select option{background:var(--surface2);}

/* Type selector */
.type-selector{display:flex;gap:8px;margin-bottom:14px;}
.type-btn{flex:1;padding:10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--muted2);cursor:pointer;font-size:12px;font-weight:500;text-align:center;transition:all .15s;}
.type-btn.active[data-type="bjj"]{border-color:var(--bjj);color:var(--bjj);background:rgba(95,168,255,.07);}
.type-btn.active[data-type="kick"]{border-color:var(--kick);color:var(--kick);background:rgba(255,95,95,.07);}
.type-btn.active[data-type="gym"]{border-color:var(--gym);color:var(--gym);background:rgba(176,107,255,.07);}
.type-icon{font-size:18px;display:block;margin-bottom:3px;}
.fields-bjj,.fields-kick,.fields-gym{display:none;}
.fields-bjj.show,.fields-kick.show,.fields-gym.show{display:block;}

/* Date quick-select */
.date-quick{display:flex;gap:6px;margin-bottom:6px;}
.date-quick-btn{flex:1;padding:9px 6px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--muted2);font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s;}
.date-quick-btn:hover{color:var(--text);}
.date-quick-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(200,245,100,.06);}
.date-other-btn{width:100%;padding:8px;background:none;border:1px dashed var(--border2);border-radius:7px;color:var(--muted2);font-size:12px;cursor:pointer;text-align:left;padding-left:10px;transition:all .15s;}
.date-other-btn:hover{border-color:var(--border2);color:var(--text);}
.date-other-btn.open{border-color:var(--accent);color:var(--accent);}
/* Mini cal */
.mini-cal{display:none;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:12px;margin-top:6px;}
.mini-cal.show{display:block;}
.mini-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.mini-cal-nav button{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:16px;padding:2px 8px;}
.mini-cal-nav button:hover{color:var(--text);}
.mini-cal-title{font-size:13px;font-weight:500;}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.mini-cal-dow{text-align:center;font-size:10px;color:var(--muted);padding:3px 0;}
.mini-cal-day{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:background .1s;}
.mini-cal-day:hover{background:var(--border2);}
.mini-cal-day.empty{cursor:default;pointer-events:none;}
.mini-cal-day.today{color:var(--accent);}
.mini-cal-day.selected{background:var(--accent);color:#0f0f0f;font-weight:600;}
/* Duration selects */
.duration-row{display:flex;align-items:center;gap:8px;}
.dur-select{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:10px;font-size:16px;font-family:'JetBrains Mono',monospace;font-weight:500;cursor:pointer;text-align:center;appearance:none;-webkit-appearance:none;}
.dur-select:focus{outline:none;border-color:var(--accent);}
.dur-sep{font-size:20px;color:var(--muted);flex-shrink:0;}
.dur-unit{font-size:11px;color:var(--muted2);flex-shrink:0;}

/* Exercise */
.exercise-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.exercise-row{display:grid;grid-template-columns:1fr 70px 80px 28px;gap:6px;align-items:end;}
.exercise-row input{margin:0;}
.remove-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:8px 4px;}
.remove-btn:hover{color:#ff5f5f;}
.add-btn{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 0;}
.add-btn:hover{text-decoration:underline;}

/* Submit buttons */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.btn-save{padding:12px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-save:hover{border-color:var(--accent);color:var(--accent);}
.btn-save:disabled{opacity:.4;cursor:not-allowed;}
.btn-ai{padding:12px;background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
.btn-ai:hover{background:var(--accent2);}
.btn-ai:disabled{opacity:.4;cursor:not-allowed;}

.ai-feedback{background:rgba(200,245,100,.04);border:1px solid rgba(200,245,100,.2);border-radius:10px;padding:16px;margin-top:16px;display:none;}
.ai-feedback.show{display:block;}
.ai-label{font-size:11px;font-weight:500;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.ai-text{font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;}
.ai-loading{color:var(--muted2);font-size:13px;}
.save-toast{display:none;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:13px;color:var(--muted2);}
.save-toast.show{display:block;}

/* History */
.log-list{display:flex;flex-direction:column;gap:10px;}
.log-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s;}
.log-card:hover{border-color:var(--border2);}
.log-card-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.log-type-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;}
.badge-bjj{background:rgba(95,168,255,.15);color:var(--bjj);}
.badge-kick{background:rgba(255,95,95,.15);color:var(--kick);}
.badge-gym{background:rgba(176,107,255,.15);color:var(--gym);}
.log-date{font-size:12px;color:var(--muted2);font-family:'JetBrains Mono',monospace;}
.log-title{font-size:14px;font-weight:500;margin-bottom:4px;}
.log-meta{font-size:12px;color:var(--muted2);}
.log-notes-preview{font-size:12px;color:var(--muted2);margin-top:6px;border-top:1px solid var(--border);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.log-feedback-indicator{font-size:11px;color:var(--accent);margin-top:4px;}
.empty{text-align:center;padding:48px 16px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:12px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:24px;}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal-close{background:none;border:none;color:var(--muted2);font-size:20px;cursor:pointer;padding:0 4px;}
.modal-close:hover{color:var(--text);}
.detail-row{margin-bottom:12px;}
.detail-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.detail-exercises{display:flex;flex-direction:column;gap:4px;}
.detail-exercise{display:flex;justify-content:space-between;font-size:13px;padding:6px 8px;background:var(--surface2);border-radius:4px;}
.detail-exercise-stats{color:var(--muted2);font-family:'JetBrains Mono',monospace;font-size:12px;}
.delete-btn{width:100%;padding:10px;background:none;border:1px solid var(--border2);border-radius:6px;color:#ff5f5f;font-size:13px;cursor:pointer;margin-top:16px;transition:all .15s;}
.delete-btn:hover{background:rgba(255,95,95,.1);}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav-btn{background:none;border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:6px 12px;cursor:pointer;font-size:13px;}
.cal-nav-btn:hover{background:var(--surface2);}
.cal-title{font-size:15px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:500;}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;gap:2px;}
.cal-day.today{border:1px solid var(--accent);}
.cal-day.today .cal-day-num{color:var(--accent);}
.cal-day.has-log{cursor:pointer;}
.cal-day.has-log:hover{opacity:.8;}
.cal-day-num{font-size:12px;font-family:'JetBrains Mono',monospace;line-height:1;}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:28px;}
.cal-dot{width:5px;height:5px;border-radius:50%;}

/* ── Stats ── */
.stats-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.stat-num{font-size:26px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--accent);}
.stat-label{font-size:11px;color:var(--muted2);margin-top:3px;}

/* Donut always-visible */
.pie-row{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
.pie-svg-wrap{flex-shrink:0;}
.pie-items{display:flex;flex-direction:column;gap:8px;flex:1;}
.pie-item{display:flex;align-items:center;gap:8px;}
.pie-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.pie-lbl{font-size:12px;color:var(--muted2);flex:1;}
.pie-val{font-size:12px;font-family:'JetBrains Mono',monospace;}
.pie-pct{font-size:11px;color:var(--muted);margin-left:3px;}

/* period + granularity row */
.ctrl-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.pill-group{display:flex;gap:4px;flex-wrap:wrap;}
.pill{padding:5px 12px;font-size:12px;font-weight:500;border:1px solid var(--border2);border-radius:20px;background:none;color:var(--muted2);cursor:pointer;transition:all .15s;}
.pill.active{background:var(--surface2);color:var(--text);border-color:var(--accent);}
.pill:hover{color:var(--text);}
.ctrl-sep{width:1px;height:20px;background:var(--border2);margin:0 4px;}

.chart-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;}
.chart-section-title{font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;}
.legend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted2);}
.legend-dot{width:10px;height:10px;border-radius:2px;}

/* Vertical bar chart */
.vchart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.vchart-wrap{display:flex;flex-direction:column;min-width:0;}
.vchart-bars{display:flex;align-items:flex-end;gap:5px;height:180px;}
.vchart-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:40px;gap:2px;cursor:pointer;transition:opacity .15s;}
.vchart-col:hover{opacity:.75;}
.vchart-col.empty-bar{cursor:default;}
.vchart-col.empty-bar:hover{opacity:1;}
.vchart-bar-stack{display:flex;flex-direction:column;justify-content:flex-end;width:28px;gap:0;border-radius:3px 3px 0 0;overflow:hidden;}
.vchart-seg{width:100%;}
.vchart-total{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-align:center;white-space:nowrap;min-height:12px;}
.vchart-x{font-size:9px;color:var(--muted2);text-align:center;margin-top:3px;white-space:nowrap;width:40px;}
.vchart-divider{height:1px;background:var(--border);margin:4px 0;}

/* Drill modal */
/* ── Settings ── */
.settings-section{display:flex;flex-direction:column;gap:20px;}
.settings-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;}
.settings-block-title{font-size:11px;font-weight:500;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.theme-swatch{border:2px solid var(--border2);border-radius:10px;padding:10px 4px;cursor:pointer;text-align:center;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:6px;}
.theme-swatch:hover{border-color:var(--muted2);}
.theme-swatch.active{border-color:var(--accent);}
.swatch-dot{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.1);}
.swatch-label{font-size:10px;color:var(--muted2);font-weight:500;}
.theme-swatch.active .swatch-label{color:var(--accent);}
.settings-sub{font-size:12px;color:var(--muted2);margin-top:8px;}
.data-btn{width:100%;padding:11px;background:none;border:1px solid var(--border2);border-radius:7px;color:var(--muted2);font-size:13px;cursor:pointer;text-align:left;padding-left:12px;transition:all .15s;margin-bottom:8px;}
.data-btn:hover{color:var(--text);border-color:var(--border2);}
.data-btn.danger{color:#ff5f5f;}
.data-btn.danger:hover{background:rgba(255,95,95,.07);}
.drill-item{padding:10px 0;border-bottom:1px solid var(--border);}
.drill-item:last-child{border-bottom:none;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>PER ASPERA</h1>
    <span class="header-sub">/ 苦難を越えて</span>
    <span class="streak" id="streakLabel"></span>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('log')">記録する</div>
    <div class="tab" onclick="switchTab('history')">履歴</div>
    <div class="tab" onclick="switchTab('calendar')">カレンダー</div>
    <div class="tab" onclick="switchTab('stats')">グラフ</div>
    <div class="tab" onclick="switchTab('settings')">設定</div>
  </div>

  <!-- ══ LOG ══ -->
  <div class="section active" id="tab-log">
    <div class="form-card">
      <div style="margin-bottom:14px">
        <label>種別</label>
        <div class="type-selector">
          <div class="type-btn active" data-type="bjj" onclick="selectType('bjj')"><span class="type-icon">🥋</span>柔術</div>
          <div class="type-btn" data-type="kick" onclick="selectType('kick')"><span class="type-icon">🥊</span>キック</div>
          <div class="type-btn" data-type="gym" onclick="selectType('gym')"><span class="type-icon">🏋️</span>筋トレ</div>
        </div>
      </div>

      <div style="margin-bottom:14px">
        <label>日付</label>
        <div class="date-quick" id="dateQuick">
          <button class="date-quick-btn active" id="dqToday" onclick="pickQuick(0)">今日</button>
          <button class="date-quick-btn" id="dqYest"  onclick="pickQuick(1)">昨日</button>
          <button class="date-quick-btn" id="dq2"     onclick="pickQuick(2)">2日前</button>
        </div>
        <button class="date-other-btn" id="dateOtherBtn" onclick="toggleMiniCal()">▾ それ以前の日付を選ぶ</button>
        <div class="mini-cal" id="miniCal">
          <div class="mini-cal-nav">
            <button onclick="miniCalPrev()">‹</button>
            <span class="mini-cal-title" id="miniCalTitle"></span>
            <button onclick="miniCalNext()">›</button>
          </div>
          <div class="mini-cal-grid" id="miniCalGrid"></div>
        </div>
      </div>

      <div style="margin-bottom:14px">
        <label>時間</label>
        <div class="duration-row">
          <select class="dur-select" id="selHour"></select>
          <span class="dur-unit">時間</span>
          <span class="dur-sep">:</span>
          <select class="dur-select" id="selMin"></select>
          <span class="dur-unit">分</span>
        </div>
      </div>

      <div class="fields-bjj show" id="fields-bjj">
        <div class="form-row full"><label>練習内容・メモ</label><textarea id="bjj-notes" placeholder="テーマ、気づき、課題など"></textarea></div>
        <div class="form-row" style="margin-top:14px"><div><label>スパー本数</label><input type="number" id="bjj-rounds" placeholder="5" min="0"></div><div></div></div>
      </div>
      <div class="fields-kick" id="fields-kick">
        <div class="form-row full"><label>練習内容・メモ</label><textarea id="kick-notes" placeholder="テーマ、気づき、課題など"></textarea></div>
        <div class="form-row" style="margin-top:14px"><div><label>スパー本数</label><input type="number" id="kick-rounds" placeholder="3" min="0"></div><div></div></div>
      </div>
      <div class="fields-gym" id="fields-gym">
        <div style="margin-bottom:14px">
          <label>種目・重量・回数</label>
          <div class="exercise-list" id="exercise-list">
            <div class="exercise-row">
              <input type="text" placeholder="種目（例：ベンチプレス）">
              <input type="text" placeholder="重量kg">
              <input type="text" placeholder="回数×セット">
              <button class="remove-btn" onclick="removeExercise(this)">×</button>
            </div>
          </div>
          <button class="add-btn" onclick="addExercise()">＋ 種目を追加</button>
        </div>
        <div class="form-row full"><label>メモ</label><textarea id="gym-notes" placeholder="気づき、課題など"></textarea></div>
      </div>

      <div class="btn-row" style="margin-top:16px">
        <button class="btn-save" id="btnSave" onclick="doSave(false)">記録する</button>
        <button class="btn-ai" id="btnAI" onclick="doSave(true)">記録 ＋ AIフィードバック</button>
      </div>
    </div>
    <div class="save-toast" id="saveToast">✓ 記録しました</div>
    <div class="ai-feedback" id="aiFeedback">
      <div class="ai-label">AIフィードバック</div>
      <div class="ai-text" id="aiFeedbackText"></div>
    </div>
  </div>

  <!-- ══ HISTORY ══ -->

<script>

    {t:'kick',d:37,h:1,m:0,n:kickNotes[5],r:'3'},{t:'gym',d:39,h:1,m:0,ex:gymExSets[2],n:gymNotes[2]},
    {t:'bjj',d:42,h:2,m:0,n:bjjNotes[1],r:'6'},{t:'kick',d:44,h:1,m:30,n:kickNotes[0],r:'4'},

    {t:'kick',d:66,h:1,m:30,n:kickNotes[3],r:'4'},{t:'gym',d:68,h:1,m:0,ex:gymExSets[2],n:gymNotes[2]},

    {t:'gym',d:75,h:1,m:0,ex:gymExSets[3],n:gymNotes[3]},{t:'bjj',d:78,h:1,m:30,n:bjjNotes[0],r:'5'},

  schedule.forEach(s=>{

function initUI(){
  initDurationSelects();
  updateDateLabel();
  renderMiniCal();
  renderStreak();
}

/* ══ TABS ══ */
function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['log','history','calendar','stats','settings'][i]===t));
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='history')renderHistory();
  if(t==='calendar')renderCalendar();
  if(t==='stats')renderStats();
}

/* ══ THEME ══ */
const THEMES=['','steel','ember','ash','blood'];
function applyTheme(theme,btn){
  THEMES.forEach(t=>document.body.classList.remove('theme-'+t));
  if(theme)document.body.classList.add('theme-'+theme);
  document.querySelectorAll('.theme-swatch').forEach(s=>s.classList.toggle('active',s.dataset.theme===theme));
  try{window.storage.set('per_aspera_theme',theme);}catch(e){}
}
async function loadTheme(){
  try{const r=await window.storage.get('per_aspera_theme');if(r){applyTheme(r.value,null);}}catch(e){}
}

/* ══ SETTINGS ACTIONS ══ */
function exportData(){
  const json=JSON.stringify(logs,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='per_aspera_backup.json';a.click();
  URL.revokeObjectURL(url);
}
function clearDummy(){
  if(!confirm('ダミーデータ（id:1000番台）を削除しますか？'))return;
  logs=logs.filter(l=>l.id>=2000||l.id<1000);
  saveLogs();renderHistory();renderStreak();
  alert('削除しました');
}
function selectType(t){
  currentType=t;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===t));
  document.querySelectorAll('[class^="fields-"]').forEach(el=>el.classList.remove('show'));
  document.getElementById('fields-'+t).classList.add('show');
}

/* ══ DATE ══ */
let selOffset=0; // 0=today,1=yesterday,2=2daysago,-1=custom
function isoFromDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateFromOffset(n){const d=new Date(today);d.setDate(d.getDate()-n);return d;}
function selDateStr(){
  if(selOffset>=0)return isoFromDate(dateFromOffset(selOffset));
  return`${selYear}-${String(selMonth+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
}

function pickQuick(offset){
  selOffset=offset;
  document.getElementById('miniCal').classList.remove('show');
  document.getElementById('dateOtherBtn').classList.remove('open');
  [0,1,2].forEach(i=>document.getElementById(['dqToday','dqYest','dq2'][i]).classList.toggle('active',i===offset));
  updateDateLabel();
}

function updateDateLabel(){
  const d=selOffset>=0?dateFromOffset(selOffset):new Date(selYear,selMonth,selDay);
  const wd=['日','月','火','水','木','金','土'][d.getDay()];
  const label=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${wd}）`;
  const btn=document.getElementById('dateOtherBtn');
  if(selOffset<0){btn.textContent=`▾ ${label}`;btn.classList.add('open');}
  else{btn.textContent='▾ それ以前の日付を選ぶ';btn.classList.remove('open');}
}

function toggleMiniCal(){
  const mc=document.getElementById('miniCal');
  const show=!mc.classList.contains('show');
  mc.classList.toggle('show',show);
  if(show){
    if(selOffset<0){mcYear=selYear;mcMonth=selMonth;}
    else{mcYear=today.getFullYear();mcMonth=today.getMonth();}
    renderMiniCal();
  }
}
function miniCalPrev(){mcMonth--;if(mcMonth<0){mcMonth=11;mcYear--;}renderMiniCal();}
function miniCalNext(){mcMonth++;if(mcMonth>11){mcMonth=0;mcYear++;}renderMiniCal();}
function renderMiniCal(){
  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('miniCalTitle').textContent=`${mcYear}年 ${mn[mcMonth]}`;
  const first=new Date(mcYear,mcMonth,1).getDay();
  const days=new Date(mcYear,mcMonth+1,0).getDate();
  const todayStr=isoFromDate(today);
  const curSelStr=selDateStr();
  const dows=['日','月','火','水','木','金','土'];
  let html=dows.map(d=>`<div class="mini-cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)html+=`<div class="mini-cal-day empty"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${mcYear}-${String(mcMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html+=`<div class="mini-cal-day${ds===curSelStr?' selected':''}${ds===todayStr&&ds!==curSelStr?' today':''}" onclick="pickCalDate(${mcYear},${mcMonth},${d})">${d}</div>`;
  }
  document.getElementById('miniCalGrid').innerHTML=html;
}
function pickCalDate(y,m,d){
  selYear=y;selMonth=m;selDay=d;selOffset=-1;
  [0,1,2].forEach(i=>document.getElementById(['dqToday','dqYest','dq2'][i]).classList.remove('active'));
  updateDateLabel();renderMiniCal();
  document.getElementById('miniCal').classList.remove('show');
}

/* ══ DURATION SELECTS ══ */
function initDurationSelects(){
  const h=document.getElementById('selHour');
  const m=document.getElementById('selMin');
  h.innerHTML='';m.innerHTML='';
  for(let i=0;i<=5;i++)h.innerHTML+=`<option value="${i}">${i}</option>`;
  [0,5,10,15,20,25,30,35,40,45,50,55].forEach(v=>m.innerHTML+=`<option value="${v}">${String(v).padStart(2,'0')}</option>`);
  h.value='1';m.value='30';
}
function getDurationObj(){return{h:parseInt(document.getElementById('selHour').value),m:parseInt(document.getElementById('selMin').value)};}
function resetDuration(){document.getElementById('selHour').value='1';document.getElementById('selMin').value='30';}

/* ══ FORM ══ */
function addExercise(){
  const row=document.createElement('div');row.className='exercise-row';
  row.innerHTML=`<input type="text" placeholder="種目"><input type="text" placeholder="重量kg"><input type="text" placeholder="回数×セット"><button class="remove-btn" onclick="removeExercise(this)">×</button>`;
  document.getElementById('exercise-list').appendChild(row);
}
function removeExercise(btn){const l=document.getElementById('exercise-list');if(l.children.length>1)btn.parentElement.remove();}

function getFormData(){
  const dur=getDurationObj();
  let specific={};
  if(currentType==='bjj'){specific={notes:document.getElementById('bjj-notes').value,rounds:document.getElementById('bjj-rounds').value};}
  else if(currentType==='kick'){specific={notes:document.getElementById('kick-notes').value,rounds:document.getElementById('kick-rounds').value};}
  else{
    const exercises=[];
    document.querySelectorAll('#exercise-list .exercise-row').forEach(r=>{
      const inp=r.querySelectorAll('input');if(inp[0].value)exercises.push({name:inp[0].value,weight:inp[1].value,reps:inp[2].value});
    });
    specific={exercises,notes:document.getElementById('gym-notes').value};
  }
  return{id:Date.now(),type:currentType,date:selDateStr(),duration:dur,...specific};
}

function resetForm(){
  ['bjj-notes','kick-notes','gym-notes'].forEach(id=>document.getElementById(id).value='');
  ['bjj-rounds','kick-rounds'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('exercise-list').innerHTML=`<div class="exercise-row"><input type="text" placeholder="種目（例：ベンチプレス）"><input type="text" placeholder="重量kg"><input type="text" placeholder="回数×セット"><button class="remove-btn" onclick="removeExercise(this)">×</button></div>`;
  resetDuration();
  // reset date to today
  selOffset=0;
  [0,1,2].forEach(i=>document.getElementById(['dqToday','dqYest','dq2'][i]).classList.toggle('active',i===0));
  updateDateLabel();
}

/* ══ SAVE ══ */
async function doSave(withAI){
  const btnS=document.getElementById('btnSave');
  const btnA=document.getElementById('btnAI');
  const fb=document.getElementById('aiFeedback');
  const fbText=document.getElementById('aiFeedbackText');
  const toast=document.getElementById('saveToast');

  const data=getFormData();
  logs.unshift(data);
  await saveLogs();
  renderStreak();
  resetForm();

  if(!withAI){
    fb.classList.remove('show');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),2500);
    return;
  }

  toast.classList.remove('show');
  fb.classList.add('show');
  fbText.innerHTML='<span class="ai-loading">分析中...</span>';
  btnS.disabled=true;btnA.disabled=true;

  const durLabel=data.duration.h>0?`${data.duration.h}時間${data.duration.m}分`:`${data.duration.m}分`;
  const recent=logs.slice(1,5);
  let prompt=`あなたは格闘技・筋トレのコーチです。以下の練習記録に対して、簡潔で実践的なフィードバックを日本語でください。\n\n【今日の記録】\n種別:${data.type==='bjj'?'柔術':data.type==='kick'?'キックボクシング':'筋トレ'}\n日時:${data.date} / ${durLabel}\n`;
  if(data.type!=='gym'&&data.rounds)prompt+=`スパー:${data.rounds}本\n`;
  if(data.type==='gym'&&data.exercises)data.exercises.forEach(e=>{prompt+=`  - ${e.name}${e.weight?' '+e.weight+'kg':''}${e.reps?' '+e.reps:''}\n`;});
  if(data.notes)prompt+=`メモ:${data.notes}\n`;
  if(recent.length){prompt+=`\n【直近の記録】\n`;recent.forEach(l=>{const d=l.duration;prompt+=`- ${l.date} ${l.type==='bjj'?'柔術':l.type==='kick'?'キック':'筋トレ'} ${d?`${d.h}h${d.m}m`:''}${l.notes?' / '+l.notes.substring(0,30):''}\n`;});}
  prompt+=`\n構成（400文字以内）：\n1. 良かった点\n2. 改善・次に意識すること\n3. 次回試すこと（1点）`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const json=await res.json();
    const text=json.content.map(c=>c.text||'').join('');
    fbText.textContent=text;
    logs[0].aiFeedback=text;
    await saveLogs();
  }catch(e){fbText.textContent='⚠️ フィードバック取得に失敗しました。記録は保存されています。';}
  btnS.disabled=false;btnA.disabled=false;
}

/* ══ HELPERS ══ */
function todayISO(){return`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;}
function durStr(d){if(!d)return'';if(typeof d==='object')return d.h>0?`${d.h}時間${d.m}分`:`${d.m}分`;return d+'分';}
function durMins(d){if(!d)return 0;if(typeof d==='object')return d.h*60+d.m;return parseInt(d)||0;}
function renderStreak(){
  const label=document.getElementById('streakLabel');
  if(!logs.length){label.textContent='';return;}
  const dates=[...new Set(logs.map(l=>l.date))].sort((a,b)=>b.localeCompare(a));
  let streak=0,cur=new Date();cur.setHours(0,0,0,0);
  for(let d of dates){const dd=new Date(d);const diff=Math.round((cur-dd)/86400000);if(diff<=1){streak++;cur=dd;}else break;}
  label.textContent=streak>1?`🔥 ${streak}日連続`:'';
}

/* ══ HISTORY ══ */
function renderHistory(){
  const list=document.getElementById('logList');
  if(!logs.length){list.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><p>まだ記録がありません</p></div>`;return;}
  // sort by date desc, then by id desc (insertion order) for same-day
  const sorted=[...logs].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  list.innerHTML=sorted.map((l)=>{
    const origIdx=logs.indexOf(l);
    const tl=l.type==='bjj'?'柔術':l.type==='kick'?'キック':'筋トレ';
    const meta=[];
    if(l.duration)meta.push(durStr(l.duration));
    if(l.rounds)meta.push('スパー'+l.rounds+'本');
    if(l.exercises)meta.push(l.exercises.length+'種目');
    const title=(l.notes||(l.exercises&&l.exercises.map(e=>e.name).join('・'))||'記録').substring(0,40);
    return`<div class="log-card" onclick="openDetail(${origIdx})">
      <div class="log-card-header"><span class="log-type-badge badge-${l.type}">${tl}</span><span class="log-date">${l.date}</span></div>
      <div class="log-title">${title}</div>
      <div class="log-meta">${meta.join(' · ')}</div>
      ${l.notes?`<div class="log-notes-preview">${l.notes}</div>`:''}
      ${l.aiFeedback?`<div class="log-feedback-indicator">✦ AIフィードバックあり</div>`:''}
    </div>`;
  }).join('');
}

/* ══ CALENDAR ══ */
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
function renderCalendar(){
  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calTitle').textContent=`${calYear}年 ${mn[calMonth]}`;
  const todayStr=isoFromDate(today);
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const dateMap={};
  logs.forEach(l=>{
    const ld=new Date(l.date);
    if(ld.getFullYear()===calYear&&ld.getMonth()===calMonth){
      if(!dateMap[l.date])dateMap[l.date]=new Set();
      dateMap[l.date].add(l.type);
    }
  });
  const dows=['日','月','火','水','木','金','土'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++)html+=`<div class="cal-day"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const types=dateMap[ds]?[...dateMap[ds]]:[];
    const isToday=ds===todayStr;
    const dots=types.map(t=>`<div class="cal-dot" style="background:var(--${t})"></div>`).join('');
    html+=`<div class="cal-day${isToday?' today':''}${types.length?' has-log':''}" ${types.length?`onclick="openCalDetail('${ds}')"`:''}><div class="cal-day-num">${d}</div>${dots?`<div class="cal-dots">${dots}</div>`:''}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}
function openCalDetail(ds){
  const dayLogs=logs.filter(l=>l.date===ds);if(!dayLogs.length)return;
  let html=`<div class="modal-header"><div style="font-size:15px;font-weight:600">${ds}</div><button class="modal-close" onclick="closeModal()">×</button></div>`;
  dayLogs.forEach(l=>{
    const tl=l.type==='bjj'?'柔術':l.type==='kick'?'キック':'筋トレ';
    html+=`<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><span class="log-type-badge badge-${l.type}">${tl}</span>${l.duration?`<span style="font-size:12px;color:var(--muted2)">${durStr(l.duration)}</span>`:''}</div>
      ${l.rounds?`<div class="detail-row"><div class="detail-label">スパー</div><div>${l.rounds}本</div></div>`:''}
      ${l.exercises&&l.exercises.length?`<div class="detail-row"><div class="detail-label">種目</div><div class="detail-exercises">${l.exercises.map(e=>`<div class="detail-exercise"><span>${e.name}</span><span class="detail-exercise-stats">${e.weight?e.weight+'kg':''} ${e.reps||''}</span></div>`).join('')}</div></div>`:''}
      ${l.notes?`<div class="detail-row"><div class="detail-label">メモ</div><div style="font-size:13px;line-height:1.6">${l.notes}</div></div>`:''}
      ${l.aiFeedback?`<div class="detail-row"><div class="detail-label" style="color:var(--accent)">AIフィードバック</div><div style="font-size:13px;line-height:1.7">${l.aiFeedback}</div></div>`:''}
    </div>`;
  });
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('show');
}

/* ══ STATS ══ */
const GRAN_OPTIONS={
  week:  [{k:'day',l:'日別'},{k:'total',l:'合計'}],
  month: [{k:'day',l:'日別'},{k:'week',l:'週別'},{k:'total',l:'合計'}],
  year:  [{k:'day',l:'日別'},{k:'week',l:'週別'},{k:'month',l:'月別'},{k:'total',l:'合計'}],
  all:   [{k:'month',l:'月別'},{k:'year',l:'年別'},{k:'total',l:'合計'}]
};

function setPeriod(p,btn){
  currentPeriod=p;
  document.querySelectorAll('#periodPills .pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentGran=GRAN_OPTIONS[p][0].k;
  renderGranPills();
  renderStats();
}
function renderGranPills(){
  document.getElementById('granPills').innerHTML=GRAN_OPTIONS[currentPeriod].map(o=>
    `<button class="pill${o.k===currentGran?' active':''}" onclick="setGran('${o.k}',this)">${o.l}</button>`
  ).join('');
}
function setGran(g,btn){
  currentGran=g;
  document.querySelectorAll('#granPills .pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderStats();
}

function getDateRange(p){
  const now=new Date();now.setHours(0,0,0,0);
  if(p==='week'){const d=new Date(now);d.setDate(d.getDate()-d.getDay());return{start:d,end:now};}
  if(p==='month'){return{start:new Date(now.getFullYear(),now.getMonth(),1),end:now};}
  if(p==='year'){return{start:new Date(now.getFullYear(),0,1),end:now};}
  return{start:new Date('2000-01-01'),end:now};
}
function sumType(arr,t){return arr.filter(l=>l.type===t).reduce((s,l)=>s+durMins(l.duration),0);}
function fmtH(v){return`${Math.floor(v/60)}h${v%60}m`;}

/* Build groups — empty periods filled as 0 */
function buildGroups(period,gran,filtered){
  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  if(gran==='total'){
    return[{label:'合計',bjj:sumType(filtered,'bjj'),kick:sumType(filtered,'kick'),gym:sumType(filtered,'gym'),logs:filtered}];
  }

  if(gran==='day'){
    const{start,end}=getDateRange(period);
    const groups=[];
    const cur=new Date(start);
    while(cur<=end){
      const ds=cur.toISOString().split('T')[0];
      const dl=filtered.filter(l=>l.date===ds);
      const wd=['日','月','火','水','木','金','土'][cur.getDay()];
      groups.push({label:`${cur.getMonth()+1}/${cur.getDate()}(${wd})`,bjj:sumType(dl,'bjj'),kick:sumType(dl,'kick'),gym:sumType(dl,'gym'),logs:dl,key:ds});
      cur.setDate(cur.getDate()+1);
    }
    return groups;
  }

  if(gran==='week'){
    // fill all weeks in range
    const{start,end}=getDateRange(period);
    const weekMap={};
    // seed all weeks
    const cur=new Date(start);
    cur.setDate(cur.getDate()-cur.getDay()); // go to sunday
    while(cur<=end){
      const wk=cur.toISOString().split('T')[0];
      if(!weekMap[wk])weekMap[wk]={bjj:0,kick:0,gym:0,logs:[]};
      cur.setDate(cur.getDate()+7);
    }
    filtered.forEach(l=>{
      const d=new Date(l.date);const sun=new Date(d);sun.setDate(d.getDate()-d.getDay());
      const wk=sun.toISOString().split('T')[0];
      if(!weekMap[wk])weekMap[wk]={bjj:0,kick:0,gym:0,logs:[]};
      weekMap[wk][l.type]+=durMins(l.duration);
      weekMap[wk].logs.push(l);
    });
    return Object.entries(weekMap).sort(([a],[b])=>a.localeCompare(b)).map(([wk,v])=>{
      const d=new Date(wk);return{label:`${d.getMonth()+1}/${d.getDate()}週`,bjj:v.bjj,kick:v.kick,gym:v.gym,logs:v.logs,key:wk};
    });
  }

  if(gran==='month'){
    if(period==='year'){
      const yr=new Date().getFullYear();
      return Array.from({length:12},(_,m)=>{
        const ml=filtered.filter(l=>{const d=new Date(l.date);return d.getFullYear()===yr&&d.getMonth()===m;});
        const key=`${yr}-${String(m+1).padStart(2,'0')}`;
        return{label:mn[m],bjj:sumType(ml,'bjj'),kick:sumType(ml,'kick'),gym:sumType(ml,'gym'),logs:ml,key};
      });
    }
    // all-period: find min/max month, fill gaps
    if(!filtered.length)return[];
    const dates=filtered.map(l=>l.date).sort();
    const[sy,sm]=dates[0].split('-').map(Number);
    const[ey,em]=dates[dates.length-1].split('-').map(Number);
    const groups=[];
    let cy=sy,cm=sm-1;
    while(cy<ey||(cy===ey&&cm<=em-1)){
      const key=`${cy}-${String(cm+1).padStart(2,'0')}`;
      const ml=filtered.filter(l=>{const d=new Date(l.date);return d.getFullYear()===cy&&d.getMonth()===cm;});
      groups.push({label:`${cy}/${cm+1}`,bjj:sumType(ml,'bjj'),kick:sumType(ml,'kick'),gym:sumType(ml,'gym'),logs:ml,key});
      cm++;if(cm>11){cm=0;cy++;}
    }
    return groups;
  }

  if(gran==='year'){
    if(!filtered.length)return[];
    const dates=filtered.map(l=>l.date.split('-')[0]).sort();
    const sy=parseInt(dates[0]),ey=parseInt(dates[dates.length-1]);
    return Array.from({length:ey-sy+1},(_,i)=>{
      const yr=String(sy+i);
      const yl=filtered.filter(l=>l.date.startsWith(yr));
      return{label:yr+'年',bjj:sumType(yl,'bjj'),kick:sumType(yl,'kick'),gym:sumType(yl,'gym'),logs:yl,key:yr};
    });
  }
  return[];
}

/* SVG donut */
function renderDonut(filtered){
  const totalBjj=sumType(filtered,'bjj');
  const totalKick=sumType(filtered,'kick');
  const totalGym=sumType(filtered,'gym');
  const tot=totalBjj+totalKick+totalGym;

  const R=44,cx=52,cy=52,stroke=14;
  const circ=2*Math.PI*R;
  function arc(value,offset,color){
    if(!tot||!value)return'';
    const dash=value/tot*circ;
    return`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }
  const offBjj=0,offKick=totalBjj/tot*circ,offGym=(totalBjj+totalKick)/tot*circ;
  const svg=`<svg width="104" height="104" viewBox="0 0 104 104">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="${stroke}"/>
    ${arc(totalBjj,offBjj,'var(--bjj)')}
    ${arc(totalKick,offKick,'var(--kick)')}
    ${arc(totalGym,offGym,'var(--gym)')}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="var(--muted2)" font-family="JetBrains Mono,monospace">${tot?fmtH(tot):'0h'}</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Inter,sans-serif">合計</text>
  </svg>`;

  const pct=v=>tot?Math.round(v/tot*100):0;
  const items=[
    {color:'var(--bjj)',label:'柔術',val:totalBjj},
    {color:'var(--kick)',label:'キック',val:totalKick},
    {color:'var(--gym)',label:'筋トレ',val:totalGym}
  ].map(i=>`<div class="pie-item">
    <div class="pie-dot" style="background:${i.color}"></div>
    <div class="pie-lbl">${i.label}</div>
    <div class="pie-val">${fmtH(i.val)}<span class="pie-pct">${pct(i.val)}%</span></div>
  </div>`).join('');

  document.getElementById('pieRow').innerHTML=`
    <div class="pie-svg-wrap">${svg}</div>
    <div class="pie-items">${items}</div>
  `;
}

function renderStats(){
  if(!currentGran){currentGran=GRAN_OPTIONS[currentPeriod][0].k;renderGranPills();}
  const{start,end}=getDateRange(currentPeriod);
  const filtered=logs.filter(l=>{const d=new Date(l.date);return d>=start&&d<=end;});
  const total=filtered.length;
  const totalMin=filtered.reduce((s,l)=>s+durMins(l.duration),0);

  document.getElementById('statsTop').innerHTML=`
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">セッション数</div></div>
    <div class="stat-card"><div class="stat-num">${Math.round(totalMin/60*10)/10}</div><div class="stat-label">合計時間 (h)</div></div>
    <div class="stat-card"><div class="stat-num">${total>0?Math.round(totalMin/total):0}</div><div class="stat-label">平均時間 (分)</div></div>
  `;

  renderDonut(filtered);
  renderGranPills();

  const groups=buildGroups(currentPeriod,currentGran,filtered);
  const maxVal=Math.max(...groups.map(g=>g.bjj+g.kick+g.gym),1);
  const chartH=160;

  const titleMap={week:'今週',month:'今月',year:'今年',all:'全期間'};
  const granMap={day:'日別',week:'週別',month:'月別',year:'年別',total:'合計'};
  document.getElementById('chartTitle').textContent=`${titleMap[currentPeriod]} / ${granMap[currentGran]}`;

  document.getElementById('vchartBars').innerHTML=groups.map((g,gi)=>{
    const t=g.bjj+g.kick+g.gym;
    const hTotal=t/maxVal*chartH;
    const hBjj=t?g.bjj/t*hTotal:0;
    const hKick=t?g.kick/t*hTotal:0;
    const hGym=t?g.gym/t*hTotal:0;
    return`<div class="vchart-col${!t?' empty-bar':''}">
      <div class="vchart-total">${t?Math.round(t)+'m':''}</div>
      <div class="vchart-bar-stack" style="height:${chartH}px">
        ${hGym>0?`<div class="vchart-seg" style="height:${hGym}px;background:var(--gym);cursor:pointer" onclick="openDrill(${gi},'gym')" title="筋トレ"></div>`:''}
        ${hKick>0?`<div class="vchart-seg" style="height:${hKick}px;background:var(--kick);cursor:pointer" onclick="openDrill(${gi},'kick')" title="キック"></div>`:''}
        ${hBjj>0?`<div class="vchart-seg" style="height:${hBjj}px;background:var(--bjj);cursor:pointer" onclick="openDrill(${gi},'bjj')" title="柔術"></div>`:''}
        ${!t?`<div style="height:3px;width:100%;background:var(--border2);border-radius:2px;margin-top:auto"></div>`:''}
      </div>
      <div class="vchart-x">${g.label}</div>
    </div>`;
  }).join('');

  // store groups for drill-down
  window._chartGroups=groups;
}

function openDrill(gi,typeFilter){
  const g=window._chartGroups[gi];
  if(!g||!g.logs)return;
  const typeLabelMap={bjj:'柔術',kick:'キック',gym:'筋トレ'};
  const typeLabel=typeLabelMap[typeFilter];
  const filtered=typeFilter?g.logs.filter(l=>l.type===typeFilter):g.logs;
  if(!filtered.length)return;
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const totalMins=sorted.reduce((s,l)=>s+durMins(l.duration),0);
  const periodLabel=['今週','今月','今年','全期間'][['week','month','year','all'].indexOf(currentPeriod)];
  let html=`<div class="modal-header">
    <div>
      <div style="font-size:12px;color:var(--muted2);margin-bottom:4px">${periodLabel} / ${g.label}</div>
      <div style="display:flex;align-items:center;gap:8px">
        ${typeFilter?`<span class="log-type-badge badge-${typeFilter}">${typeLabel}</span>`:''}
        <span style="font-size:15px;font-weight:600">${sorted.length}回・${fmtH(totalMins)}</span>
      </div>
    </div>
    <button class="modal-close" onclick="closeModal()">×</button>
  </div>`;
  sorted.forEach(l=>{
    const tl=typeLabelMap[l.type];
    const title=(l.notes||(l.exercises&&l.exercises.map(e=>e.name).join('・'))||'記録').substring(0,40);
    html+=`<div class="drill-item">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
        <span class="log-type-badge badge-${l.type}">${tl}</span>
        <span class="log-date">${l.date}</span>
        ${l.duration?`<span style="font-size:11px;color:var(--muted2)">${durStr(l.duration)}</span>`:''}
      </div>
      ${title?`<div style="font-size:13px;color:var(--muted2)">${title}</div>`:''}
      ${l.rounds?`<div style="font-size:12px;color:var(--muted)">スパー ${l.rounds}本</div>`:''}
      ${l.aiFeedback?`<div style="font-size:11px;color:var(--accent);margin-top:2px">✦ AIフィードバックあり</div>`:''}
    </div>`;
  });
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('show');
}

/* ══ MODAL ══ */
function openDetail(idx){
  const l=logs[idx];
  const tl=l.type==='bjj'?'柔術':l.type==='kick'?'キック':'筋トレ';
  const title=(l.notes||(l.exercises&&l.exercises.map(e=>e.name).join('・'))||'記録').substring(0,60);
  let html=`<div class="modal-header">
    <div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="log-type-badge badge-${l.type}">${tl}</span><span class="log-date">${l.date}</span></div>
      <div style="font-size:15px;font-weight:600">${title}</div>
    </div>
    <button class="modal-close" onclick="closeModal()">×</button>
  </div>`;
  if(l.duration)html+=`<div class="detail-row"><div class="detail-label">時間</div><div>${durStr(l.duration)}</div></div>`;
  if(l.rounds)html+=`<div class="detail-row"><div class="detail-label">スパー</div><div>${l.rounds}本</div></div>`;
  if(l.exercises&&l.exercises.length)html+=`<div class="detail-row"><div class="detail-label">種目</div><div class="detail-exercises">${l.exercises.map(e=>`<div class="detail-exercise"><span>${e.name}</span><span class="detail-exercise-stats">${e.weight?e.weight+'kg':''} ${e.reps||''}</span></div>`).join('')}</div></div>`;
  if(l.notes)html+=`<div class="detail-row"><div class="detail-label">メモ</div><div style="font-size:13px;line-height:1.6">${l.notes}</div></div>`;
  if(l.aiFeedback)html+=`<div class="detail-row" style="margin-top:12px"><div class="detail-label" style="color:var(--accent)">AIフィードバック</div><div style="font-size:13px;line-height:1.7">${l.aiFeedback}</div></div>`;
  html+=`<button class="delete-btn" onclick="deleteLog(${idx})">この記録を削除</button>`;
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(e){if(!e||e.target===document.getElementById('modalOverlay'))document.getElementById('modalOverlay').classList.remove('show');}
async function deleteLog(idx){
  if(!confirm('削除しますか？'))return;
  logs.splice(idx,1);await saveLogs();closeModal();renderHistory();renderStreak();
}

document.addEventListener('click',e=>{
  const mc=document.getElementById('miniCal');
  const btn=document.getElementById('dateOtherBtn');
  if(mc.classList.contains('show')&&!mc.contains(e.target)&&e.target!==btn){mc.classList.remove('show');}
});

loadLogs();
</script>
